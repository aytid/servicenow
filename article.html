<!DOCTYPE html>
<html lang="en" data-theme="nowpulse">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article — Rohan Aditya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="images/r-letter-logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="reading-progress" id="readingProgress"></div>

    <!-- Top 3-Theme Switcher Bar -->
    <div class="theme-ribbon">
        <div class="theme-ribbon-inner">
            <div class="ribbon-label">
                <span class="ribbon-dot"></span>
                <span>NOWPLATFORM DEV NOTES</span>
            </div>
            <div class="theme-pills" role="group" aria-label="Theme Switcher">
                <button class="theme-pill active" data-set-theme="nowpulse" onclick="articleApp.setTheme('nowpulse')">
                    <span class="theme-swatch" style="background:#62d84e;"></span>NowPulse
                </button>
                <button class="theme-pill" data-set-theme="glidedocs" onclick="articleApp.setTheme('glidedocs')">
                    <span class="theme-swatch" style="background:#0066cc;"></span>GlideDocs
                </button>
                <button class="theme-pill" data-set-theme="darkdev" onclick="articleApp.setTheme('darkdev')">
                    <span class="theme-swatch" style="background:#58a6ff;"></span>DarkDev Terminal
                </button>
            </div>
        </div>
    </div>

    <!-- Sticky Header -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="brand">
                <img src="images/rohannow-logo.png" alt="Rohan Aditya Logo">
                <span class="brand-badge">← All Articles</span>
            </a>

            <div class="header-actions">
                <a href="index.html" class="btn-outline-header">← Back to Playground</a>
            </div>
        </div>
    </header>

    <!-- 3-Column Documentation Reader -->
    <main class="article-shell">
        <!-- Left Rail: More Articles -->
        <aside class="article-left-rail">
            <div class="rail-title">More Guides</div>
            <div class="sidebar-tag-list" id="relatedArticlesList"></div>
        </aside>

        <!-- Center Rail: Main Article -->
        <div id="articleContainer"></div>

        <!-- Right Rail: Sticky Table of Contents -->
        <aside class="article-toc-rail">
            <div class="rail-title">On This Page</div>
            <ul class="toc-list" id="tocList"></ul>
        </aside>
    </main>

    <div class="toast-container" id="toastContainer"></div>
    <script src="data.js"></script>
    <script src="article.js"></script>
</body>

</html>
